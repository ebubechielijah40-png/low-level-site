name: Verify learning site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DJANGO_DEBUG: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --no-save --no-audit --no-fund jsdom@30.1.1
      - name: Check schema and behaviour
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test --noinput
          python tools/verify_examples.py
          python tools/http_smoke.py
          python tools/deployment_smoke.py
          python tools/production_smoke.py
      - name: Check frontend DOM
        run: |
          python tools/frontend_fixture.py "$RUNNER_TEMP/bare-metal-dom"
          node tools/frontend_dom_smoke.cjs "$RUNNER_TEMP/bare-metal-dom"
          node --check core/static/core/js/app.js
          node --check core/static/core/js/model.js
          node --check core/static/core/js/performance.js
          node --check tools/browser_smoke.cjs
      - name: Record application timings
        # Shared CI timings exclude WAN/browser/load and do not gate releases.
        run: python tools/benchmark_requests.py
