{% if form.non_field_errors %}<div class="form-errors" role="alert">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label><div class="input-wrap">{{ field }}{% if field.field.widget.input_type == 'password' %}<button type="button" class="password-toggle" data-target="{{ field.id_for_label }}" aria-label="Show {{ field.label|lower }}" aria-pressed="false"><svg><use href="#i-eye"/></svg></button>{% endif %}</div>{% if field.errors %}<div class="field-error" role="alert">{{ field.errors }}</div>{% endif %}</div>{% endfor %}
