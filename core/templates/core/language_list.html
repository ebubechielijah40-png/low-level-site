{% extends 'core/base.html' %}
{% block content %}
<div class="container">
    <h1>Languages</h1>
    <p style="opacity: 0.5; margin-bottom: 2rem; font-size: 13px;">Select a language to begin.</p>
    <ul>
        {% for language in languages %}
        <li style="margin-bottom: 1rem;">
            <a href="{% url 'language_detail' language.pk %}" style="font-size: 1.1rem;">
                &gt; {{ language.name }}
            </a>
            <p style="opacity: 0.5; font-size: 13px; margin-top: 4px;">{{ language.description }}</p>
        </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
