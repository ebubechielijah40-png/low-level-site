<div class="model-panel"><div class="panel-title"><span>{{ system.name|upper }} / COMPONENT VIEW</span><span class="accent">SIMULATED</span></div><canvas class="hardware-model" data-system="{{ system.slug }}" data-selected="{{ lab.component|default:'' }}" tabindex="0" aria-label="Interactive conceptual {{ system.name }} model. Drag to rotate, scroll to zoom, or use the component buttons."></canvas><div class="model-controls"><span>DRAG TO ORBIT / SCROLL TO ZOOM</span><div><button type="button" data-model-action="left" aria-label="Rotate model left">↶</button><button type="button" data-model-action="right" aria-label="Rotate model right">↷</button><button type="button" data-model-action="in" aria-label="Zoom in">+</button><button type="button" data-model-action="out" aria-label="Zoom out">−</button><button type="button" data-model-action="reset" aria-label="Reset model view">⌖</button></div></div><div class="component-buttons" aria-label="Select a component"></div><div class="component-detail"><span class="component-name">Select a component</span><span class="component-description muted">Inspect the model and its role.</span></div></div>{% if component_routes %}{{ component_routes|json_script:'component-routes' }}{% endif %}
