<a class="track-card" href="{% url 'language_detail' language.pk %}"><div class="track-top"><span class="track-number">{{ language.order|stringformat:'02d' }}</span><span class="index-label">{{ language.lesson_count }} LESSONS</span></div><h3>{{ language.name }}</h3><p>{{ language.subtitle }}</p><div class="progress-track"><span style="width:{{ language.percentage }}%"></span></div><div class="track-bottom"><span>{{ language.completed }} / {{ language.lesson_count }} complete</span><span class="accent">↗</span></div></a>
